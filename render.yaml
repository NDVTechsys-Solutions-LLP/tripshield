services:
  - type: web
    name: tripshield-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: tripshield
      - key: CORS_ORIGINS
        value: "*"
      - key: ERSS_PHONE
        value: "9620910910"
      - key: ERSS_EMAIL
        value: "narendra.macherla@ndvtechsys.com"
      - key: INTEGRATION_PROXY_URL
        value: "https://integrations.emergentagent.com"
